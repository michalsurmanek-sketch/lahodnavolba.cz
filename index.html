<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102c26">
<title>Lahodná volba — něco lahodného se připravuje</title>
<meta name="description" content="Na dobré věci se vyplatí počkat. Připravujeme pro vás novou Lahodnou volbu. Web je právě ve výstavbě.">
<meta property="og:title" content="Lahodná volba — něco lahodného se připravuje">
<meta property="og:description" content="Nový web právě dozrává. Děkujeme za trpělivost a těšíme se na vás.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lahodnavolba.cz/">
<style>
:root{color-scheme:dark;--gold:#dec28b;--white:#fcf8ed;--muted:#b8c7bd}
*{box-sizing:border-box}
body{margin:0;background:#102c26;color:var(--white);font-family:Arial,Helvetica,sans-serif;min-height:100svh}
.page{min-height:100svh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#224a3c 0,transparent 65%)}
.page:before,.page:after{content:"";position:absolute;width:640px;height:640px;border:1px solid #dec28b12;border-radius:50%;pointer-events:none}
.page:before{top:-380px;right:-260px}.page:after{bottom:-470px;left:-250px;width:800px;height:800px}
header,footer{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:32px clamp(24px,6vw,100px)}
.brand{display:flex;align-items:center;gap:12px;font-family:Georgia,serif;font-size:24px;letter-spacing:-.5px}
.brand svg{width:32px;height:40px;color:var(--gold)}
.domain{font-size:14px;color:var(--muted);letter-spacing:1px}
main{flex:1;display:grid;place-items:center;padding:40px 24px 72px;position:relative;z-index:1}
.content{width:100%;max-width:850px;text-align:center}
.emblem{width:144px;height:144px;margin:0 auto 32px;position:relative;display:grid;place-items:center;border:1px solid #dec28b38;border-radius:50%;background:radial-gradient(circle,#dec28b0b,transparent 70%)}
.emblem:before{content:"";position:absolute;inset:9px;border:1px solid #dec28b19;border-radius:50%}
.emblem svg{width:100px;height:100px;color:var(--gold)}
.label{text-transform:uppercase;font-size:14px;letter-spacing:3px;color:var(--gold);margin:0 0 24px}
h1{font:normal clamp(48px,7vw,88px)/1.07 Georgia,'Times New Roman',serif;letter-spacing:-2px;margin:0 0 26px}
h1 em{font-weight:normal;color:var(--gold)}
.description{font-size:18px;line-height:1.8;color:var(--muted);max-width:470px;margin:0 auto}
.rule{width:56px;height:1px;background:var(--gold);opacity:.6;margin:34px auto 26px}
.status{font-size:14px;letter-spacing:.4px;margin:0;color:var(--gold)}
footer{font-size:14px;color:var(--muted);padding-top:24px;padding-bottom:26px;border-top:1px solid #ffffff0c}
footer span:last-child{color:var(--gold)}
@media(max-width:560px){header{padding:24px}.brand{font-size:21px}.domain{display:none}main{padding:30px 24px 54px}.emblem{width:124px;height:124px;margin-bottom:28px}h1{letter-spacing:-1.5px}.label{font-size:12px;letter-spacing:2.5px}.description{font-size:16px;max-width:320px}footer{flex-direction:column;gap:10px;text-align:center;padding:22px 20px}}
</style>
</head>
<body>
<div class="page">
<header>
<div class="brand"><svg viewBox="0 0 32 40" fill="none" aria-hidden="true"><path d="M16 36V17M16 26C4 26 3 16 4 9c9 0 12 7 12 17ZM16 20C28 20 29 10 28 3c-9 0-12 7-12 17Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Lahodná volba</div>
<span class="domain">lahodnavolba.cz</span>
</header>
<main>
<div class="content">
<div class="emblem" aria-hidden="true"><svg viewBox="0 0 100 100" fill="none"><path d="M21 64a29 29 0 0 1 58 0M17 65h66M24 74h52M50 29v6M46 28a4 4 0 1 1 8 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M39 16c-5-7 3-8 0-14M59 18c-5-7 3-8 0-14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity=".6"/></svg></div>
<p class="label">Na dobré věci se vyplatí počkat</p>
<h1>Něco lahodného<br>se <em>připravuje.</em></h1>
<p class="description">Právě pro vás chystáme novou Lahodnou volbu.<br>Dejte nám ještě chvilku, ať vše doladíme do posledního sousta.</p>
<div class="rule" aria-hidden="true"></div>
<p class="status">Web je právě ve výstavbě</p>
</div>
</main>
<footer><span>Lahodná volba © 2026</span><span>Těšíme se na vás.</span></footer>
</div>
</body>
</html>
